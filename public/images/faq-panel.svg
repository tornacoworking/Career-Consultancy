<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-label="Illustration of a young woman resting her chin on her hand, thinking, with question marks floating around her">
  <title>A young woman thinking, with question marks around her</title>
  <rect width="600" height="900" fill="#FFE6D6"/>
  <circle cx="300" cy="170" r="330" fill="#FFD5BC" opacity=".55"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(70 60) rotate(-12) scale(1.15)" stroke="#FF914D" stroke-width="15"><path d="M0 22 C0 -14 54 -14 54 22 C54 48 27 50 27 80"/><path d="M27 108 v.1" stroke-width="22"/></g>
    <g transform="translate(250 20) rotate(8) scale(.9)" stroke="#191919" stroke-width="15"><path d="M0 22 C0 -14 54 -14 54 22 C54 48 27 50 27 80"/><path d="M27 108 v.1" stroke-width="22"/></g>
    <g transform="translate(430 90) rotate(16) scale(1.3)" stroke="#B54A14" stroke-width="14"><path d="M0 22 C0 -14 54 -14 54 22 C54 48 27 50 27 80"/><path d="M27 108 v.1" stroke-width="20"/></g>
    <g transform="translate(40 250) rotate(10) scale(.6)" stroke="#191919" stroke-width="18"><path d="M0 22 C0 -14 54 -14 54 22 C54 48 27 50 27 80"/><path d="M27 108 v.1" stroke-width="24"/></g>
    <g transform="translate(520 300) rotate(-8) scale(.7)" stroke="#FF914D" stroke-width="17"><path d="M0 22 C0 -14 54 -14 54 22 C54 48 27 50 27 80"/><path d="M27 108 v.1" stroke-width="22"/></g>
  </g>
  <circle cx="190" cy="190" r="7" fill="#FF914D"/><circle cx="360" cy="250" r="6" fill="#191919"/><circle cx="110" cy="360" r="8" fill="#FF914D"/>
  <g transform="translate(-30 262) scale(1.1)">
  <!-- backdrop -->
  <circle cx="300" cy="310" r="262" fill="#FFE6D6"/>
  <circle cx="300" cy="310" r="262" fill="none" stroke="#FF914D" stroke-width="2" stroke-dasharray="3 12" stroke-linecap="round" opacity=".7"/>

  <!-- floating question marks -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(398 88) rotate(12)" stroke="#191919" stroke-width="13">
      <path d="M0 22 C0 -14 54 -14 54 22 C54 48 27 50 27 80"/>
      <path d="M27 108 v.1" stroke-width="22"/>
    </g>
    <g transform="translate(92 150) rotate(-14) scale(.78)" stroke="#FF914D" stroke-width="15">
      <path d="M0 22 C0 -14 54 -14 54 22 C54 48 27 50 27 80"/>
      <path d="M27 108 v.1" stroke-width="22"/>
    </g>
    <g transform="translate(478 250) rotate(18) scale(.6)" stroke="#B54A14" stroke-width="17">
      <path d="M0 22 C0 -14 54 -14 54 22 C54 48 27 50 27 80"/>
      <path d="M27 108 v.1" stroke-width="22"/>
    </g>
    <g transform="translate(150 60) rotate(6) scale(.42)" stroke="#191919" stroke-width="20">
      <path d="M0 22 C0 -14 54 -14 54 22 C54 48 27 50 27 80"/>
      <path d="M27 108 v.1" stroke-width="22"/>
    </g>
  </g>
  <circle cx="452" cy="170" r="7" fill="#FF914D"/>
  <circle cx="130" cy="290" r="5" fill="#191919"/>
  <circle cx="500" cy="372" r="5" fill="#FF914D"/>

  <!-- body -->
  <path d="M104 600 C104 478 176 440 300 440 C424 440 496 478 496 600 Z" fill="#FF914D"/>
  <path d="M262 440 C270 470 330 470 338 440 Z" fill="#E9A57F"/>
  <!-- neck -->
  <path d="M270 380 L270 446 C282 470 318 470 330 446 L330 380 Z" fill="#E9A57F"/>
  <path d="M270 410 C290 424 314 424 330 410 L330 380 L270 380 Z" fill="#D98F69" opacity=".55"/>

  <!-- back hair and bun -->
  <circle cx="300" cy="128" r="36" fill="#2B1D16"/>
  <path d="M212 300 C200 190 252 148 300 148 C350 148 402 190 390 300 C392 352 372 376 356 372 L244 372 C228 376 210 352 212 300 Z" fill="#2B1D16"/>

  <!-- face -->
  <ellipse cx="300" cy="300" rx="80" ry="92" fill="#F2BC98"/>
  <ellipse cx="222" cy="306" rx="9" ry="16" fill="#F2BC98"/>
  <ellipse cx="378" cy="306" rx="9" ry="16" fill="#F2BC98"/>

  <!-- fringe -->
  <path d="M218 286 C220 214 262 184 304 186 C352 188 384 222 384 278 C346 262 306 240 276 212 C262 244 244 268 218 286 Z" fill="#2B1D16"/>

  <!-- brows (one raised) and eyes glancing up and to the side -->
  <path d="M254 286 q16 -10 32 -2" fill="none" stroke="#2B1D16" stroke-width="5" stroke-linecap="round"/>
  <path d="M316 276 q17 -14 34 -4" fill="none" stroke="#2B1D16" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="271" cy="306" rx="11" ry="9" fill="#fff"/>
  <ellipse cx="331" cy="306" rx="11" ry="9" fill="#fff"/>
  <circle cx="276" cy="303" r="6" fill="#2B1D16"/>
  <circle cx="336" cy="303" r="6" fill="#2B1D16"/>
  <circle cx="278" cy="301" r="1.8" fill="#fff"/>
  <circle cx="338" cy="301" r="1.8" fill="#fff"/>
  <!-- nose, cheeks, mouth -->
  <path d="M302 312 q-6 16 4 19" fill="none" stroke="#C98862" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="254" cy="334" r="11" fill="#FF914D" opacity=".28"/>
  <circle cx="348" cy="334" r="11" fill="#FF914D" opacity=".28"/>
  <path d="M290 350 q12 -7 25 1" fill="none" stroke="#B0524A" stroke-width="4.5" stroke-linecap="round"/>

  <!-- arm: sleeve, forearm and hand resting under the chin -->
  <path d="M388 600 C392 540 384 496 360 452 L430 430 C470 480 478 540 476 600 Z" fill="#E9833A"/>
  <path d="M360 452 L346 392" fill="none" stroke="#F2BC98" stroke-width="40" stroke-linecap="round"/>
  <path d="M360 452 L430 430" fill="none" stroke="#E9833A" stroke-width="46" stroke-linecap="round"/>
  <ellipse cx="338" cy="368" rx="34" ry="24" transform="rotate(-24 338 368)" fill="#F2BC98"/>
  <path d="M318 360 q14 -10 30 -8 M316 372 q16 -8 34 -6" fill="none" stroke="#D98F69" stroke-width="3" stroke-linecap="round"/>
</g>
</svg>
