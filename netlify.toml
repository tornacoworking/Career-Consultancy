[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Branch deploys and deploy previews must never be indexed
[context.deploy-preview]
  command = "npm run build:staging"
[context.branch-deploy]
  command = "npm run build:staging"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/feedback"
  to = "/.netlify/functions/feedback"
  status = 200
  force = true

[[redirects]]
  from = "/api/enquiry"
  to = "/.netlify/functions/enquiry"
  status = 200
  force = true

# The site's service URLs are /services/real-time-project-training/, /services/visa-documentation/
# and /services/experience-certificate/. These permanent redirects send earlier URLs (and the retired
# certification page) to the right place.

[[redirects]]
  from = "/services/experience-documents"
  to = "/services/experience-certificate/"
  status = 301
[[redirects]]
  from = "/services/experience-documents/*"
  to = "/services/experience-certificate/:splat"
  status = 301
[[redirects]]
  from = "/services/experience-document-assistance"
  to = "/services/experience-certificate/"
  status = 301
[[redirects]]
  from = "/services/experience-document-assistance/*"
  to = "/services/experience-certificate/:splat"
  status = 301
[[redirects]]
  from = "/services/online-training"
  to = "/services/real-time-project-training/"
  status = 301
[[redirects]]
  from = "/services/online-training/*"
  to = "/services/real-time-project-training/:splat"
  status = 301
[[redirects]]
  from = "/services/visa-services"
  to = "/services/visa-documentation/"
  status = 301
[[redirects]]
  from = "/services/visa-services/*"
  to = "/services/visa-documentation/:splat"
  status = 301
[[redirects]]
  from = "/services/online-certifications"
  to = "/services/real-time-project-training/"
  status = 301
[[redirects]]
  from = "/services/online-certifications/*"
  to = "/services/real-time-project-training/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://formsubmit.co; form-action 'self' https://formsubmit.co; frame-ancestors 'none'; base-uri 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
